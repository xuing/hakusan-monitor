<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Mount prefix ("/hakusan" behind the proxy, "" at the root): everything
      // before the first app route segment. <base> makes the relative asset
      // URLs below resolve under it from any page; src/lib/base-path.ts reads
      // it back. Keep the route list in sync with src/lib/nav.ts (tested).
      (function () {
        var routes = ["partitions", "analytics", "login-nodes", "nodes", "jobs", "slurm", "containers", "project"];
        var segs = location.pathname.split("/").filter(Boolean);
        var i = segs.findIndex(function (s) { return routes.indexOf(s) >= 0; });
        var base = (i >= 0 ? segs.slice(0, i) : segs).join("/");
        var el = document.createElement("base");
        el.href = "/" + (base ? base + "/" : "");
        document.head.appendChild(el);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Live load & queue dashboard for the JAIST Hakusan HPC cluster." />
    <title>Hakusan Monitor</title>
    <script>
      // Apply saved theme before paint; otherwise follow the browser preference.
      try {
        const langs = ["ja", "en", "zh"];
        const savedLang = localStorage.getItem("hm_lang");
        const browserLangs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
        const lang = langs.includes(savedLang)
          ? savedLang
          : (browserLangs.map((l) => String(l).slice(0, 2)).find((l) => langs.includes(l)) || "en");
        document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;

        const saved = localStorage.getItem("hm_theme");
        const dark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
